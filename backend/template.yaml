AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Hackathon Backend SAM Template

Resources:
  HackathonAppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HackathonAppTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  HackathonApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  MemberApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HackathonAppTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Environment:
        Variables:
          TABLE_NAME: !Ref HackathonAppTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HackathonApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${HackathonApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
